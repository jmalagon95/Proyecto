name: Integrar habilidades raciales al maestro
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/integrate-racial-master.yml'
      - 'scripts/integrate-racial-master.mjs'
      - 'scripts/clean-master-catalog.mjs'
      - 'scripts/test-master-canonical.mjs'
      - 'scripts/integrate-mission-experience.mjs'
      - 'scripts/enrich-mission-chronicle.mjs'
      - 'scripts/integrate-goblin-stat-gacha.mjs'
      - 'scripts/test-goblin-gacha.mjs'
      - 'src/systems/stat-gacha.js'
      - 'src/systems/combat-stats.js'
      - 'src/systems/mission-simulator.js'
      - 'data/missions.json'
      - 'data/classes.json'
      - 'data/races.json'
      - 'scripts/test-racial-techniques.mjs'
      - 'src/systems/master-racial-bridge.js'
      - 'src/systems/battle-lanes.js'
      - 'src/systems/battle-focus.js'
      - 'scripts/integrate-battle-focus.mjs'
      - 'scripts/integrate-battle-lanes.mjs'
      - 'scripts/integrate-manual-formations.mjs'
      - 'scripts/neutralize-lane-labels.mjs'
      - 'scripts/test-manual-formations.mjs'
      - 'scripts/audit-mission-ui.mjs'
      - 'scripts/audit-lobby-ui.mjs'
      - 'scripts/test-mission-ui-e2e.mjs'
      - 'scripts/integrate-premium-lobby.mjs'
      - 'scripts/test-premium-lobby-e2e.mjs'
      - 'src/ui/kami-premium-lobby.css'
      - 'src/ui/kami-premium-lobby.js'
      - 'scripts/fix-mission-runtime.mjs'
      - 'scripts/test-battle-lanes.mjs'
      - 'src/systems/combat-cooldowns.js'
      - 'src/systems/effects.js'
      - 'scripts/racial-skill-design.mjs'
      - 'scripts/test-combat-cooldowns.mjs'
permissions:
  contents: write
concurrency:
  group: kami-master-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar prototipo actual
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar generador y combate racial
        run: |
          node scripts/test-racial-skill-design.mjs
          node scripts/test-racial-techniques.mjs
          node scripts/test-combat.mjs
          node scripts/test-combat-cooldowns.mjs
          node scripts/test-goblin-gacha.mjs
      - name: Integrar dentro de index.html
        run: node scripts/integrate-racial-master.mjs --write
      - name: Eliminar razas y clases obsoletas del maestro
        run: node scripts/clean-master-catalog.mjs --write
      - name: Integrar el mismo gacha de estadísticas en goblins del maestro
        run: node scripts/integrate-goblin-stat-gacha.mjs --write
      - name: Añadir cinco equipos, crónica de 180 segundos y MVP
        run: node scripts/integrate-mission-experience.mjs --write
      - name: Inicializar crónica sin bloquear menú de misión
        run: node scripts/fix-mission-runtime.mjs --write
      - name: Relatar golpes reales y corregir daño efectivo
        run: node scripts/enrich-mission-chronicle.mjs --write
      - name: Aplicar campo de batalla 2.5D
        run: node scripts/integrate-battle-lanes.mjs --write
      - name: Aplicar formaciones manuales guardadas
        run: node scripts/integrate-manual-formations.mjs --write
      - name: Carriles numerados, sin posiciones por rol
        run: node scripts/neutralize-lane-labels.mjs --write
      - name: Aplicar rediseño premium a todos los menús
        run: node scripts/integrate-premium-lobby.mjs --write
      - name: Integrar Focus individual en combate automático
        run: node scripts/integrate-battle-focus.mjs --write
      - name: Validar razas, clases, migraciones y JavaScript
        run: |
          node scripts/test-master-canonical.mjs
          node scripts/integrate-battle-focus.mjs
          node --check src/systems/battle-focus.js
          node scripts/integrate-premium-lobby.mjs
          node --check src/ui/kami-premium-lobby.js
          node scripts/test-battle-lanes.mjs
          node scripts/test-manual-formations.mjs
          node scripts/audit-mission-ui.mjs
          node scripts/audit-lobby-ui.mjs
          node --check src/systems/battle-lanes.js
          node --check src/systems/master-racial-bridge.js
          node scripts/integrate-mission-experience.mjs
          node scripts/fix-mission-runtime.mjs
          node scripts/enrich-mission-chronicle.mjs
          node scripts/integrate-goblin-stat-gacha.mjs
          node scripts/integrate-battle-lanes.mjs
          node scripts/integrate-manual-formations.mjs
          node scripts/neutralize-lane-labels.mjs
          git diff --check
      - name: Probar menú de misión en navegador móvil real
        run: |
          npm install --no-save --no-package-lock playwright-core
          node scripts/ensure-content.mjs
          python3 -m http.server 5173 >/tmp/kami-server.log 2>&1 &
          sleep 2
          node scripts/test-mission-ui-e2e.mjs
          node scripts/test-premium-lobby-e2e.mjs
      - name: Guardar maestro actualizado en main
        run: |
          git config user.name "kami-automation[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "feat(master): lobby y menús anime premium con navegación funcional"
            git push
          else
            echo "El index maestro ya estaba integrado."
          fi
